global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: razorrisk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
  - job_name: razorrisk-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["investigation-worker:9101"]
