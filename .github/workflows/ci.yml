name: CI

on:
  push:
    branches: ["main", "ci-cd/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run full test suite
        env:
          DATABASE_URL: sqlite:////tmp/razorrisk_ci.db
          REDIS_REQUIRED: "false"
          DEBUG: "false"
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q agent api db infra ml utils


  supabase:
    name: Supabase PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are unavailable to pull requests from forks; run this live
    # integration check only for trusted pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PostgreSQL driver
        run: pip install "psycopg[binary]>=3.2.0"

      - name: Verify Supabase PostgreSQL connection and schema
        run: |
          python - <<'PY'
          import os
          import psycopg

          url = os.environ.get("DATABASE_URL", "").strip()
          if not url:
              raise SystemExit("SUPABASE_DATABASE_URL GitHub secret is not configured")

          required_tables = {
              "users", "devices", "ip_addresses", "merchants",
              "transactions", "risk_scores", "investigation_reports",
              "system_logs", "human_reviews", "user_watchlist",
          }

          with psycopg.connect(url, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database(), current_user, version()")
                  database, user, version = cur.fetchone()
                  print(f"Connected to PostgreSQL database={database!r} user={user!r}")
                  print(version.splitlines()[0])

                  cur.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                  """)
                  tables = {row[0] for row in cur.fetchall()}

                  missing = required_tables - tables
                  if missing:
                      raise SystemExit(
                          "Supabase schema is incomplete. Missing tables: "
                          + ", ".join(sorted(missing))
                      )

                  cur.execute("SELECT 1")
                  assert cur.fetchone() == (1,)

                  cur.execute("""
                      CREATE TEMP TABLE razorrisk_ci_smoke (
                          id INTEGER PRIMARY KEY,
                          marker TEXT NOT NULL
                      )
                  """)
                  cur.execute(
                      "INSERT INTO razorrisk_ci_smoke (id, marker) VALUES (%s, %s)",
                      (1, "supabase-ci"),
                  )
                  cur.execute(
                      "SELECT marker FROM razorrisk_ci_smoke WHERE id = %s",
                      (1,),
                  )
                  assert cur.fetchone() == ("supabase-ci",)

          print("Supabase PostgreSQL connection, schema, and transactional smoke test passed.")
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build application image
        run: docker build --tag razorrisk:ci .
